[workspace]
members = [
    "crates/codeatlas-domain",
    "crates/codeatlas-application",
    "crates/codeatlas-adapters",
    "crates/codeatlas-infrastructure",
]
resolver = "2"

[package]
name = "codeatlas"
version = "3.0.1"
edition = "2021"
authors = ["Giau Phan <giauphan012@gmail.com>"]
description = "High-performance Rust MCP server for CodeAtlas"
license = "MIT"

[dependencies]
codeatlas-domain = { path = "crates/codeatlas-domain" }
codeatlas-application = { path = "crates/codeatlas-application" }
codeatlas-adapters = { path = "crates/codeatlas-adapters" }
codeatlas-infrastructure = { path = "crates/codeatlas-infrastructure" }

tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[[bin]]
name = "codeatlas"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
