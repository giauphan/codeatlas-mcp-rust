[workspace]
members = [
    "crates/codeatlas-domain",
    "crates/codeatlas-application",
    "crates/codeatlas-adapters",
    "crates/codeatlas-infrastructure",
]
resolver = "2"

[package]
name = "codeatlas-cli"
version = "0.3.1"
edition = "2021"
authors = ["Giau Phan <giauphan012@gmail.com>"]
description = "High-performance Rust MCP server for CodeAtlas"
license = "MIT"
repository = "https://github.com/giauphan/codeatlas-mcp-rust"
homepage = "https://github.com/giauphan/codeatlas-mcp-rust"
readme = "README.md"
keywords = ["mcp", "codeatlas", "ast", "clean-architecture", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["bin", "docs", "test"]

[dependencies]
codeatlas-domain = { path = "crates/codeatlas-domain", version = "0.3.1" }
codeatlas-application = { path = "crates/codeatlas-application", version = "0.3.1" }
codeatlas-adapters = { path = "crates/codeatlas-adapters", version = "0.3.1" }
codeatlas-infrastructure = { path = "crates/codeatlas-infrastructure", version = "0.3.1" }

tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[[bin]]
name = "codeatlas"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
