name: Pre-Push Tests

# This workflow runs on every push to ensure code passes all tests
# It's designed to be fast and fail quickly if there are issues

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Rust Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust test suite
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release

      - name: Verify CLI launcher
        run: |
          node bin/codeatlas.js --version
          node bin/codeatlas.js doctor
