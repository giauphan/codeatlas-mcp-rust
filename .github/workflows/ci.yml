name: CI

# ──────────────────────────────────────────────────────────
# ① TRIGGER  —  code push / PR → webhook → schedules build
# ──────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ──────────────────────────────────────────────────────────
# ② RUST NATIVE ENGINE CI PIPELINE
# ──────────────────────────────────────────────────────────
jobs:
  # ── Rust native engine CI ──────────────────────────────
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --locked --workspace

      - name: Build release binary
        run: cargo build --locked --release

      - name: Test Node launcher wrapper
        run: |
          node bin/codeatlas.js --version
          node bin/codeatlas.js doctor

  # ── PASS/FAIL gate ─────────────────────────────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - name: All checks passed
        run: echo "CI passed — all Rust and launcher checks are green"
