[package]
name = "codeatlas-application"
version = "0.3.1"
edition = "2021"
authors = ["Giau Phan <giauphan012@gmail.com>"]
description = "Application layer use cases and orchestrators for CodeAtlas"
license = "MIT"
repository = "https://github.com/giauphan/codeatlas-mcp-rust"
homepage = "https://github.com/giauphan/codeatlas-mcp-rust"

[dependencies]
codeatlas-domain = { path = "../codeatlas-domain", version = "0.3.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
validator = { version = "0.20", features = ["derive"] }
tokio = { version = "1.40", features = ["sync", "macros"] }
tracing = "0.1"
