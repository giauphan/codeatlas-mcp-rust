[package]
name = "codeatlas-application"
version = "3.0.1"
edition = "2021"
authors = ["Giau Phan <giauphan012@gmail.com>"]
description = "Application layer use cases and orchestrators for CodeAtlas"
license = "MIT"

[dependencies]
codeatlas-domain = { path = "../codeatlas-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }
tokio = { version = "1.40", features = ["sync", "macros"] }
tracing = "0.1"
